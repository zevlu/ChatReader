<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoDriver 網頁車機</title>
<!--
  CoDriver 網頁車機 v2（2026-11-04：三站互動展示）
  網址參數：
    ?station=1  遲到救星（A55 實機、真的傳 Messenger）
    ?station=2  約定偵探（模擬器、模擬聊天）
    ?station=3  貼心副駕（模擬器、主動關心＋AI 路由）
    不加 = 一般模式（雛形，沒有任務）
    ?unit=1     只有車機（2026-11-11）：開車畫面改用 BeamNG.drive，網頁只顯示車機；
                車速、油量、塞車來自 BeamNG（電腦上的 beamng_bridge.py 送給手機）
                聲音預設在手機（手機唸、手機聽：說「副駕」、按手機 🎤 泡泡、網頁「🎤 手機聽我說」或空白鍵）
                &voice=pc 改用電腦喇叭＋電腦麥克風（按住「🎙」或空白鍵說話）
                工作人員：Shift+T 塞車 +10 分、Shift+V 到停靠點、Shift+D 抵達、Shift+L 遲到檢查、Shift+F 疲勞
    &phone=IP:8765  直接開檔案時指定手機位址
  操作：↑↓←→ 開車、按住空白鍵說話、A 自動駕駛、Enter 開始
  工作人員：Shift+T 塞車、Shift+G 油量 12%、Shift+F 疲勞、Shift+L 遲到檢查、Shift+R 回開場
  手機 CoDriver App = 車上的電腦（AI、真的 Messenger）；這個網頁 = 車機螢幕＋模擬的車。
-->
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --panel2:#1f2840; --line:#2c3754; --text:#e8ecf5; --muted:#9aa6c2;
          --accent:#7b9cff; --ok:#4fd1a5; --warn:#ffb454; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--text);
              font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; overflow:hidden; }
  #app { position:relative; display:grid; grid-template-rows:62vh 38vh; height:100vh; }
  #sim { position:relative; background:#bcd6ee; }
  #sim canvas { display:block; width:100%; height:100%; }
  .chip { background:rgba(15,20,32,.75); color:#fff; padding:6px 12px; border-radius:999px; font-size:15px; }
  #hud { position:absolute; right:16px; top:12px; display:flex; gap:8px; }
  #apBadge { display:none; background:rgba(31,122,92,.9); }
  #turn { position:absolute; left:50%; top:14px; transform:translateX(-50%); background:rgba(20,60,160,.88); color:#fff;
          padding:10px 22px; border-radius:14px; font-size:22px; font-weight:700; display:none; }
  #banner { position:absolute; left:50%; top:74px; transform:translateX(-50%); background:rgba(180,90,20,.92); color:#fff;
            padding:10px 22px; border-radius:14px; font-size:20px; font-weight:700; display:none; }
  #mission { position:absolute; left:16px; top:12px; width:340px; background:rgba(15,20,32,.82); border-radius:16px; padding:14px 16px; display:none; }
  #mission h3 { margin:0 0 8px; font-size:20px; }
  .step { font-size:15px; color:#8f9bb8; padding:3px 0; }
  .step.now { color:#fff; font-size:18px; font-weight:700; }
  .step.done { color:var(--ok); }
  #tryRow { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .try { background:#2f4fd1; color:#fff; border:none; border-radius:999px; padding:6px 12px; font-size:15px; cursor:pointer; font-family:inherit; }
  #subs { position:absolute; left:50%; bottom:46px; transform:translateX(-50%); width:min(900px, 70%); text-align:center; }
  #subHeard { font-size:17px; color:#e8ecf5; text-shadow:0 1px 3px #000; min-height:1.4em; }
  #subSay { display:inline-block; background:rgba(15,20,32,.82); color:#fff; font-size:24px; font-weight:700; padding:8px 18px; border-radius:12px; line-height:1.4; }
  #subSay:empty { display:none; }
  #mic { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); font-size:15px; color:#fff; background:rgba(15,20,32,.75); padding:4px 14px; border-radius:999px; }
  #mic.on { background:#c0392b; }
  #legend { position:absolute; right:16px; bottom:10px; font-size:14px; color:#fff; background:rgba(15,20,32,.7); padding:6px 12px; border-radius:10px; }
  #unit { background:var(--bg); display:grid; grid-template-columns:3fr 4fr 3fr; gap:10px; padding:10px; min-height:0; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px 14px; overflow:hidden;
           display:flex; flex-direction:column; gap:8px; min-height:0; }
  .title { font-size:13px; color:var(--muted); letter-spacing:1px; display:flex; justify-content:space-between; }
  #mini { width:100%; flex:1; min-height:0; background:#0b101b; border-radius:10px; }
  #chats { display:none; flex:1; min-height:0; overflow:hidden; font-size:13px; line-height:1.55; }
  .chat { background:#0b101b; border-radius:10px; padding:5px 10px; margin-bottom:5px; line-height:1.45; transition:opacity .3s; }
  .chat.dim { opacity:.4; }
  .chat b { color:var(--accent); }
  .chat .hl { background:#5a4512; color:#ffd88a; border-radius:4px; padding:0 4px; }
  .chat .why { color:var(--warn); font-size:12px; }
  #eta { font-size:16px; }
  #pipe { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .cell { background:var(--panel2); border-radius:10px; padding:8px; font-size:13px; min-height:64px; transition:background .3s; }
  .cell .k { color:var(--muted); font-size:12px; }
  .cell .v { white-space:pre-line; }
  .cell.lit { background:#183f35; }
  .cell.lit.last { background:#22325f; }
  #say { font-size:20px; line-height:1.45; font-weight:600; min-height:1.5em; }
  #ask { display:none; background:var(--panel2); border-radius:12px; padding:8px 10px; }
  #ask .q { font-size:14px; color:var(--warn); margin-bottom:6px; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:7px 12px;
           font-size:15px; cursor:pointer; font-family:inherit; }
  button:hover { border-color:var(--accent); }
  button.primary { background:#2f4fd1; border-color:#2f4fd1; }
  button.go { background:#1f7a5c; border-color:#1f7a5c; }
  button.no { background:#6b2b35; border-color:#6b2b35; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #cmd { flex:1; min-width:120px; background:#0b101b; color:var(--text); border:1px solid var(--line); border-radius:10px;
         padding:8px 10px; font-size:15px; font-family:inherit; }
  .card { background:var(--panel2); border-radius:12px; padding:8px 10px; font-size:14px; line-height:1.5; }
  .bar { height:10px; background:#0b101b; border-radius:6px; overflow:hidden; }
  .bar > div { height:100%; background:var(--ok); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:14px; }
  #conn { font-size:12px; }
  #log { font-size:12px; color:var(--muted); line-height:1.5; overflow:hidden; flex:1; }
  .speed { font-size:34px; font-weight:800; }
  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center;
             background:rgba(8,12,22,.72); color:#fff; z-index:10; cursor:pointer; }
  .overlay h1 { font-size:64px; margin:0 0 12px; }
  .overlay p { font-size:26px; margin:6px 0; max-width:1100px; line-height:1.5; text-wrap:balance; }
  #app.attract #subs, #app.attract #mic, #app.attract #legend { display:none; }
  .overlay .start { margin-top:28px; font-size:30px; background:#2f4fd1; padding:14px 40px; border-radius:999px; }
  .overlay .sub { font-size:18px; color:#c9d2ea; }
  #endList { font-size:24px; line-height:1.8; text-align:left; margin:12px 0; }
  /* ?unit=1 只有車機：開車畫面在 BeamNG，網頁整頁都是車機 */
  #app.unitOnly { grid-template-rows:100vh; }
  #app.unitOnly #sim { display:none; }
  #app.unitOnly #say { font-size:20px; line-height:1.35; max-height:2.7em; overflow:hidden; flex-shrink:0; }
  #app.unitOnly .panel { gap:6px; padding:10px 12px; }
  #app.unitOnly .cell { min-height:0; padding:6px 8px; }
  #app.unitOnly .cell .v { max-height:4.3em; overflow:hidden; }
  #app.unitOnly #eta { font-size:18px; line-height:1.6; }
  #banner.float { position:fixed; top:10px; z-index:20; }
  #micBtn { background:#2f4fd1; border-color:#2f4fd1; font-weight:700; user-select:none; }
  #micBtn.on { background:#c0392b; border-color:#c0392b; }
  .gameTag { font-size:12px; color:var(--muted); }
  .hint { font-size:13px; color:var(--muted); }
  /* ?unit=1 車機地圖（Leaflet＋OpenStreetMap，2026-11-17） */
  #map { display:none; flex:1 1 65%; min-height:0; border-radius:10px; background:#0b101b; color:var(--muted); font-size:14px; }
  #app.unitOnly #map { display:block; }
  #app.unitOnly #eta { flex:0 0 auto; }
  .carIcon, .destIcon { background:none; border:none; }
  .carArrow { width:30px; height:30px; transition:transform .3s; }
  .destPin { font-size:26px; line-height:30px; text-align:center; filter:drop-shadow(0 1px 2px #000); }
  .turnTxt { font-size:24px; font-weight:700; color:var(--accent); }
  .turnTxt.off { font-size:16px; color:var(--warn); font-weight:400; }
</style>
</head>
<body>
<div id="app">
  <div id="sim">
    <div id="mission"><h3 id="mTitle"></h3><div id="mSteps"></div><div id="tryRow"></div></div>
    <div id="hud"><span class="chip" id="apBadge">🚗 自動駕駛中</span><span class="chip" id="hudSpeed">0 km/h</span><span class="chip" id="hudFuel">⛽ 80%</span><span class="chip" id="hudClock">--:--</span></div>
    <div id="turn"></div>
    <div id="banner"></div>
    <div id="subs"><div id="subHeard"></div><div id="subSay"></div></div>
    <div id="mic">🎙 按住空白鍵說話</div>
    <div id="legend">↑↓←→ 開車　按住空白鍵 說話　A 自動駕駛　Enter 開始</div>
  </div>
  <div id="unit">
    <div class="panel">
      <div class="title"><span id="leftTitle">🧭 導航</span><span id="navState">沒有導航</span></div>
      <div id="chats"></div>
      <canvas id="mini"></canvas>
      <div id="map"></div>
      <div id="eta">說「帶我去逢甲夜市」或「帶我去加油站」</div>
    </div>
    <div class="panel">
      <div class="title"><span>🚗 CoDriver 副駕・AI 怎麼想</span><span id="conn">⚪ 未連線</span></div>
      <div id="pipe">
        <div class="cell" id="c1"><div class="k">① 聽到</div><div class="v"></div></div>
        <div class="cell" id="c2"><div class="k">② 交給誰</div><div class="v"></div></div>
        <div class="cell" id="c3"><div class="k">③ 做了什麼</div><div class="v"></div></div>
        <div class="cell" id="c4"><div class="k">④ 結果</div><div class="v"></div></div>
      </div>
      <div id="say">按「上車」開始旅程</div>
      <div id="ask"><div class="q" id="askQ"></div><div class="row" id="askBtns"></div></div>
      <div class="row" id="freeBtns">
        <button class="primary" onclick="action('board')">🚗 上車</button>
        <button onclick="action('listen')">🎤 手機聽我說</button>
        <button onclick="action('end')">🏁 下車</button>
        <button onclick="action('stop')">⏹ 停止</button>
        <label style="font-size:13px;color:var(--muted)"><input type="checkbox" id="webVoice"> 網頁也唸</label>
        <label style="font-size:13px;color:var(--muted)"><input type="checkbox" id="navVoice" checked> 導航語音</label>
      </div>
      <div class="row">
        <input id="cmd" placeholder="也可以打字跟副駕說，例如：帶我去逢甲夜市" onkeydown="if(event.key==='Enter'||event.key==='Escape'){event.stopPropagation();if(event.key==='Enter')sendCmd();this.blur()}">
        <button onclick="sendCmd()">送出指令</button>
      </div>
    </div>
    <div class="panel">
      <div class="title"><span>✉️ 訊息與車況</span><span id="clock2"></span></div>
      <div class="row" style="justify-content:space-between">
        <div><span class="speed" id="speed">0</span> km/h</div>
        <div style="flex:1;margin-left:14px"><div style="font-size:13px;color:var(--muted)">油量 <span id="fuelTxt">80%</span></div><div class="bar"><div id="fuelBar" style="width:80%"></div></div></div>
      </div>
      <div class="grid2">
        <div class="card">❄️ 冷氣 <b id="ac">24</b> 度・風量 <b id="fan">2</b></div>
        <div class="card">🪟 車窗 <b id="win">關</b>・💡 車燈 <b id="lights">關</b></div>
      </div>
      <div class="card" id="appt">📍 還沒有約定</div>
      <div class="card" id="msg" style="display:none"></div>
      <div id="log"></div>
    </div>
  </div>
  <div class="overlay" id="attract" onclick="onEnter()">
    <div class="sub" id="aNo"></div>
    <h1 id="aTitle"></h1>
    <p id="aTag"></p>
    <div class="start">按 Enter 或點這裡開始</div>
    <p class="sub">約 2～3 分鐘・照著左上角的提示做就好</p>
  </div>
  <div class="overlay" id="endcard" onclick="toAttract()">
    <h1>🎉 任務完成</h1>
    <p>你剛剛體驗了：</p>
    <div id="endList"></div>
    <p id="endNext"></p>
    <p class="sub" id="endCount"></p>
  </div>
</div>

<!-- 2026-11-18：three.js 由手機提供（assets/lib），會場沒網路也能用；從別的地方開這個網頁時才改用 CDN -->
<script src="/lib/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
// ───────────────────────── 連線（手機 CoDriver App） ─────────────────────────
const params = new URLSearchParams(location.search);
let BASE = location.protocol.startsWith('http') ? location.origin : '';
if (params.get('phone')) BASE = 'http://' + params.get('phone').replace(/^https?:\/\//, '');
if (!BASE) {
  const p = prompt('手機 CoDriver 的位址（App 紀錄裡的「網頁車機」那行，例如 192.168.43.1:8765）；留空 = 離線測試');
  if (p) BASE = 'http://' + p.trim().replace(/^https?:\/\//, '');
}
let connected = false;
let state = {};

function post(obj) {
  if (!BASE || !connected) return Promise.resolve();
  return fetch(BASE + '/api', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(obj) })
    .catch(() => {});
}
function connect() {
  if (!BASE) { setConn(false, '離線測試'); return; }
  const es = new EventSource(BASE + '/events');
  es.addEventListener('state', e => {
    if (!connected) {
      connected = true; setConn(true);
      // 展示站、只有車機：聲音交給電腦（手機不唸、不聽）
      post({ type: 'hello', silent: !!ST || (UNIT && VOICE === 'pc'), station: ST ? Number(params.get('station')) : 0, unit: UNIT });
    }
    try { onState(JSON.parse(e.data)); } catch (err) { console.warn(err); }
  });
  es.onerror = () => { connected = false; setConn(false, '重新連線中…'); };
}
function setConn(ok, why) {
  document.getElementById('conn').textContent = ok ? '🟢 已連線車上電腦' : '⚪ ' + (why || '未連線');
}
function action(name) {
  if (!connected) { localSay('（離線）要連上車上電腦（手機）才能用這個功能'); return; }
  post({ type: 'action', name });
}
function sendCmd(text) {
  const box = document.getElementById('cmd');
  const t = (text ?? box.value).trim();
  if (!t) return;
  box.value = '';
  touch();
  if (ST && mission.phase === 'attract') startMission();
  if (mission.phase === 'run' && t.includes('取消') && curStep() && curStep().cancelOk) mission.flags.cancelled = true;
  if (connected) { post({ type: 'cmd', text: t }); document.getElementById('subHeard').textContent = '你：' + t; return; }
  // 離線測試：「去 X」「帶我去 X」直接在網頁規劃並出發
  const m = t.match(/(?:去|到|導航到|帶我去)\s*(.+)$/);
  if (m) { localPlan(m[1].trim()); } else localSay('（離線）只能測導航，例如：帶我去逢甲夜市');
}
function localSay(t) { document.getElementById('say').textContent = t; document.getElementById('subSay').textContent = t; }

// ───────────────────────── 三站設定 ─────────────────────────
const STATIONS = {
  1: {
    no: '1 號站', name: '⏰ 遲到救星', fuel: 80,
    tagline: '你跟孟澤約在逢甲夜市，路上卻堵車了——讓副駕幫你告訴他。說「送出」，訊息才會真的傳出去。',
    steps: [
      { text: '說「帶我去跟孟澤約的地方」', tries: ['帶我去跟孟澤約的地方'], done: s => !!s.appt },
      { text: '說「好」，讓副駕規劃路線', tries: ['好'], done: () => !!nav.dest },
      { text: '再說「好」，開始導航', tries: ['好'], done: () => nav.active },
      { text: '開車（或按 A 自動駕駛）', tries: [], done: () => mission.flags.accident && !!(state.ask || '').length },
      { text: '副駕問要不要通知孟澤：說「好」', tries: ['好'], done: s => !!s.msg },
      { text: '確認訊息：說「送出」或「取消」', tries: ['送出', '取消'], cancelOk: true, done: () => mission.flags.sent || mission.flags.cancelled },
    ],
    summary: ['副駕從路況算出你會遲到，主動問你要不要通知', '訊息由車上電腦在真的 Messenger 裡填好', '按不按「送出」，永遠由你決定'],
    next: '想看 AI 怎麼從聊天裡找到地點？去 2 號站「約定偵探」',
  },
  2: {
    no: '2 號站', name: '🔍 約定偵探', fuel: 80,
    tagline: '你不記得跟朋友約在哪——只要說「去跟誰約的地方」，副駕自己從聊天裡找。',
    steps: [
      { text: '看左下的聊天，說「帶我去跟小美約的地方」（也可以選別人）', tries: ['帶我去跟小美約的地方', '帶我去跟阿凱約的地方', '帶我去跟孟澤約的地方'], done: s => !!s.appt },
      { text: '說「好」，讓副駕規劃路線', tries: ['好'], done: () => !!nav.dest },
      { text: '再說「好」，開始導航', tries: ['好'], done: () => nav.active },
      { text: '開到目的地（按 A 自動駕駛）', tries: [], done: () => nav.arrived },
    ],
    chats: {
      '孟澤': ['孟澤：今晚 7 點逢甲夜市見？', '我：好啊', '孟澤：那我先去排隊'],
      '小美': ['小美：明天下午先約高鐵站？', '我：好啊，幾點？', '小美：三點！', '小美：欸改去咖啡廳好了，高鐵站人太多'],
      '阿凱': ['阿凱：報告還沒做完欸', '我：那要約討論嗎', '阿凱：那下課後學校圖書館前面'],
    },
    summary: ['你只說了「跟誰」，副駕就自己去讀聊天', 'AI 看得懂改過的約定，跟著最後的決定走', '找到地點後直接幫你導航'],
    next: '想看真的訊息送出去？去 1 號站「遲到救星」',
  },
  3: {
    no: '3 號站', name: '🤝 貼心副駕', fuel: 30, drain: 10,
    tagline: '開一趟車去高鐵站，你只管開——看副駕在你開口之前就想到什麼。',
    steps: [
      { text: '說「帶我去高鐵站」', tries: ['帶我去高鐵站'], done: () => !!nav.dest },
      { text: '說「好」，開始導航', tries: ['好'], done: () => nav.active },
      { text: '開車（或按 A 自動駕駛），副駕會主動提醒加油：說「好」', tries: ['好'], done: () => !!(nav.via && nav.viaDone) },
      { text: '說「好熱，冷氣開強一點」，看 AI 交給誰', tries: ['好熱，冷氣開強一點'], done: s => s.car && (s.car.ac < mission.startAc || s.car.fan > mission.startFan) },

function missionTick(now) {
  if (!ST) return;
  if (mission.phase === 'end') {
    const left = 20 - Math.floor((now - mission.endAt) / 1000);
    document.getElementById('endCount').textContent = `${Math.max(0, left)} 秒後回到開場（按 Enter 或點畫面馬上回去）`;
    if (left <= 0) toAttract();
    return;
  }
  if (mission.phase !== 'run') return;
  // 閒置太久 → 回開場（自動駕駛中放寬到 90 秒）
  if (now - mission.lastInput > (autopilot ? 90000 : 45000)) { toAttract(); return; }
  // 步驟完成就往下
  let moved = false;
  while (curStep() && curStep().done(state)) { mission.step++; moved = true; }
  if (moved) { renderMission(); if (!curStep()) { finishMission(); return; } }
  // 各站的劇本
  if (nav.active && !mission.navStartAt) { mission.navStartAt = now; mission.pathLen0 = pathLen(currentPath()); }
  if (!nav.active) mission.navStartAt = 0;
  if (ST === STATIONS[1] && nav.active && !mission.flags.accident && mission.pathLen0 > 0) {
    const done = 1 - pathLen(currentPath()) / mission.pathLen0;
    if (done > 0.33) {
      mission.flags.accident = true; nav.delay += 12; nav.lastReport = 0;   // 馬上回報新的到達時間，手機才算得出會遲到
      showBanner('⚠ 前方事故，車流變慢', 5000);

    }

  // 4 號站：加完油、往約定地點開了 30% 之後塞車（跟 1 號站一樣讓副駕算出會遲到）
  if (ST === STATIONS[4] && nav.active && nav.via && nav.viaDone && nav.dest && !nav.dest.gas && !mission.flags.accident) {
    const left = pathLen(currentPath());
    if (!mission.flags.leg2) mission.flags.leg2 = left;
    else if (1 - left / mission.flags.leg2 > 0.3) {
      mission.flags.accident = true; nav.delay += 12; nav.lastReport = 0;
      showBanner('⚠ 前方事故，車流變慢', 5000);
      setTimeout(() => action('late'), 1500);
    }
  }
  if ((ST === STATIONS[1] || ST === STATIONS[4]) && (state.log || []).some(l => l.includes('已送出'))) mission.flags.sent = true;
  if (ST === STATIONS[3]) {
    const st = curStep();
    if (st && st.tries.includes('笑話') && !mission.flags.fatigueSent) {
      mission.flags.fatigueSent = true;
      setTimeout(() => action('fatigue'), 3000);

    if (mission.flags.jokeAsked && !(state.ask || '').includes('笑話')) mission.flags.joke = true;
  }
}

/** AI 怎麼想：聽到 → 交給誰 → 做了什麼 → 結果，每句話一格一格亮起來 */
function renderPipe(s) {
  const cell = (id, text, lit, last) => {
    const c = document.getElementById(id);
    c.querySelector('.v').textContent = text || '';
    c.classList.toggle('lit', !!lit); c.classList.toggle('last', !!last);
  };
  // 聽到新的一句：跟「上一份狀態」的回覆比，回覆變了才算這句的結果（手機可能同一次就把聽到＋回覆一起推來）
  const prevSay = pipeLastSay; pipeLastSay = s.say;
  if (s.heard && s.heard !== pipeHeard) { pipeHeard = s.heard; pipeRoute = ''; pipeSay = prevSay; cell('c1', s.heard, true); cell('c2', '判斷中…', false); cell('c3', '', false); cell('c4', '', false); }
  if (!s.heard) pipeHeard = '';   // 手機重置後 heard 會清空，下一位說同一句也能重新亮起
  if (!pipeHeard) return;
  const label = (s.routeLabel || '').replace('🔀', '').trim();
  if (label && !label.includes('判斷中') && label !== pipeRoute) {
    pipeRoute = label;
    const where = label.includes('手機') ? '🚘 車上的模型'
      : label.includes('DGX') ? '🖥 DGX 本機 AI'   // 2026-11-19：不顯示模型名稱
      : '☁️ 雲端 AI';
    cell('c2', `${where}\n${(s.routeDetail || '').replace(/・/g, ' ')}`, true);
  }
  if (s.say && s.say !== pipeSay && !s.say.endsWith('…')) {
    // 只看「你說的那句」之後的紀錄，找最後一筆動作
    const lg = s.log || [], from = lg.map(l => l.includes('你：')).lastIndexOf(true);
    const lastLog = lg.slice(from + 1).reverse().find(l => !l.includes('CarMate：') && !l.includes('路由') && !l.includes('展示重置')) || '（直接回答）';
    cell('c3', lastLog.replace(/^\S+\s+/, '').slice(0, 40), true);
    cell('c4', s.say.slice(0, 50), true, true);
  }
}

// ───────────────────────── 車子 ─────────────────────────

const keys = {};

      if (k === 'v') unitVia();

  if (UNIT) return;   // 只有車機：不在網頁開車

// ───────────────────────── 自動駕駛（沿導航路線開；開場畫面時在城市裡繞） ─────────────────────────
let autopilot = false;
let wander = null;
function setAutopilot(on) {

}
function autoPath() {
  if (nav.dest && nav.active && !nav.arrived) return currentPath();
  if (!wander || Math.hypot(car.x - wander.x, car.z - wander.z) < 10) {
    const cand = POIS.filter(p => p !== wander);
    wander = cand[Math.floor(Math.random() * cand.length)];

}
function autoInput() {
  const pts = autoPath();
  if (pts.length < 2) return { throttle: 0, brake: car.v > 0.5 ? 1 : 0, steer: 0 };
  let need = 9, tx = pts[pts.length - 1].x, tz = pts[pts.length - 1].z;
  for (let k = 1; k < pts.length; k++) {
    const a = pts[k - 1], b = pts[k], L = Math.hypot(b.x - a.x, b.z - a.z);
    if (L >= need) { tx = a.x + (b.x - a.x) * need / L; tz = a.z + (b.z - a.z) * need / L; break; }
    need -= L;
  }
  let err = Math.atan2(tz - car.z, tx - car.x) - car.yaw;
  err = Math.atan2(Math.sin(err), Math.cos(err));
  const target = 15 * Math.max(0.3, 1 - Math.abs(err) / 1.1);
  return { throttle: car.v < target ? 1 : 0, brake: car.v > target + 2 ? 0.6 : 0, steer: Math.max(-1, Math.min(1, err * 2.2)) };
}

function onRoad(x, z) {
  if (x < -ROAD || z < -ROAD || x > size + ROAD || z > size + ROAD) return false;
  const mx = ((x % B) + B) % B, mz = ((z % B) + B) % B;

  return mx < r || mx > B - r || mz < r || mz > B - r;
}
function drive(dt) {

  let throttle = keys['arrowup'] ? 1 : 0;

  let steer = (keys['arrowright'] ? 1 : 0) - (keys['arrowleft'] ? 1 : 0);
  if (gp) {
    if (Math.abs(gp.axes[0]) > 0.05) steer = gp.axes[0];
    if (gp.buttons[7]) throttle = Math.max(throttle, gp.buttons[7].value);
    if (gp.buttons[6]) brake = Math.max(brake, gp.buttons[6].value);
  }
  if (autopilot && !brake && !steer) { const a = autoInput(); throttle = Math.max(throttle, a.throttle); brake = a.brake; steer = a.steer; }

  if (brake) car.v -= (car.v > 0.5 ? 18 : 6) * brake * dt;
  if (!throttle && !brake) car.v *= Math.pow(0.6, dt);
  car.v = Math.max(REV, Math.min(MAX, car.v));

  if (onRoad(nx, nz)) { car.x = nx; car.z = nz; }
  else if (onRoad(nx, car.z)) { car.x = nx; car.v *= 0.9; }
  else if (onRoad(car.x, nz)) { car.z = nz; car.v *= 0.9; }

  const moved = Math.abs(car.v) * dt;
  car.odo += moved;

  // 掉到 13% 就恢復正常速度；展示時油量最低停在 8%，不會真的沒油拋錨
  const fast = ST && ST.drain && mission.phase === 'run' && nav.active && !(nav.via && nav.viaDone) && car.fuel > 13;
  car.fuel = Math.max(ST ? Math.min(8, car.fuel) : 0, car.fuel - moved * 0.015 * (fast ? ST.drain : 1));
}

// ───────────────────────── 導航（模擬城市） ─────────────────────────
const nav = { id: -1, active: false, dest: null, via: null, viaDone: true, path: [], delay: 0, lastReport: 0, arrived: false };

function nearestNode(x, z) { return node(Math.max(0, Math.min(N, Math.round(x / B))), Math.max(0, Math.min(N, Math.round(z / B)))); }
function gridPath(a, b, ban) {   // BFS：格子上的最短路線（只走路口）；ban = 第一步不能走回去的路口（不在路中間迴轉）

    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const ni = i + di, nj = j + dj;

      if (ban && i === a.i && j === a.j && ni === ban.i && nj === ban.j) continue;

const entryNode = p => node(p.i, p.j + 1);   // 地點入口旁的路口
function legPath(fx, fz, p, fromCar) {
  const start = fromCar ? aheadNode() : nearestNode(fx, fz);
  if (fromCar) {   // 地點就在眼前這段路上（車子跟下一個路口之間）：直接開過去
    const hx = Math.cos(car.yaw), hz = Math.sin(car.yaw), vx = p.x - fx, vz = p.z - fz;
    const along = vx * hx + vz * hz, side = Math.abs(vx * hz - vz * hx);

  }
  // 從車子出發時，不讓路線在前方路口叫你掉頭；要往回走就繞一個街區（跟真的導航一樣）
  let ban = null;

    ban = Math.abs(cx) > Math.abs(cz) ? { i: start.i - Math.sign(cx), j: start.j } : { i: start.i, j: start.j - Math.sign(cz) };

function aheadNode() {

  for (const i of [Math.floor(car.x / B), Math.ceil(car.x / B)]) for (const j of [Math.floor(car.z / B), Math.ceil(car.z / B)]) {

function pathLen(pts) { let d = 0; for (let k = 1; k < pts.length; k++) d += Math.hypot(pts[k].x - pts[k - 1].x, pts[k].z - pts[k - 1].z); return d; }

  const d = (dest || '').replace(/\s/g, '');

  flex.name = d.slice(0, 7);

// ───────────────────────── 只有車機（?unit=1）：導航在 BeamNG ─────────────────────────
// 網頁不知道 BeamNG 裡的路線，先用固定的預估時間回報給手機，讓「規劃 → 開始 → 遲到」的流程照常走；
// 真的路線由人在 BeamNG 按 M 設定 GPS。到停靠點／抵達用 Shift+V／Shift+D。（之後再改成讀 BeamNG 的 GPS）
const UNIT_MIN = 15;     // 預估車程（分鐘）
const UNIT_KMH = 30;     // 換算公里數用的平均時速
// 2026-11-17：DGX 的橋接會把 App 的目的地設到遊戲 GPS，並每秒回報位置／剩餘距離／剩餘時間（state.pose）。
// 有最近 5 秒內的遊戲 GPS 資料就用真的到達時間；沒有就用上面的 15 分鐘估算當備援。
const unav = { id: -1, dest: '', via: '', viaDone: true, active: false, arrived: false, arriveAt: 0, delay: 0, jam: 0, lastReport: 0,

function hhmmAfter(minutes) {
  const t = new Date(Date.now() + minutes * 60000);

}
/** 最近 5 秒內遊戲回報的 GPS（沒有就 null） */
function gameGps() {
  const p = state.pose;
  // 抵達瞬間橋接可能送「只有 leg 欄位」的 gps（沒有座標），那種不算有 GPS 目的地
  if (!p || Date.now() - lastPoseAt > 5000 || !p.gps || p.gps.lat == null) return null;

function unitEta() {
  const g = gameGps();

    // 2026-11-19：有停靠點時，橋接先把遊戲 GPS 設到停靠點（gps.leg = "via"），
    // 並附上停靠點到最後目的地的距離／時間（afterViaM／afterViaS），加起來才是真的到達時間
    const viaLeg = g.leg === 'via';

    const minutes = Math.max(1, Math.round(etaS / 60)) + unav.delay + unav.jam;

function unitHandleNav(n) {
  if (!n) return;
  if (n.id !== unav.id) {
    unav.id = n.id; unav.dest = n.dest || ''; unav.via = n.via || (n.viaGas ? '加油站' : ''); unav.lastLeg = '';
    unav.viaDone = !unav.via; unav.active = false; unav.arrived = false; unav.delay = 0;
    unav.arriveAt = Date.now() + UNIT_MIN * 60000;
    // 先不回報：等橋接把目的地設到遊戲 GPS、路線算好（最多 PLAN_WAIT_MS），副駕唸的分鐘數才會是真的
    unav.planPending = true; unav.planAt = Date.now(); unav.planSig = gpsSig(gameGps());

  if (n.cmd === 'cancel' || n.cmd === 'done') { if (n.cmd === 'cancel') unav.dest = ''; unav.active = false; unav.planPending = false; return; }

    unav.active = true; unav.lastReport = 0;
    unav.arrivedSeq0 = state.pose ? (state.pose.arrivedSeq || 0) : null;   // 之後遊戲 GPS 抵達次數變多 = 到了
  }

/** 規劃中：遊戲 GPS 換成新目的地且算好路線，或等太久，就回報 planned */
function unitPlanTick() {
  if (!unav.planPending) return;
  const g = gameGps();
  const ready = g && g.etaS != null && !g.planning && gpsSig(g) !== unav.planSig;
  if (!ready && Date.now() - unav.planAt < PLAN_WAIT_MS) return;
  unav.planPending = false;
  if (!ready) unav.arriveAt = Date.now() + UNIT_MIN * 60000;   // 沒等到：用 15 分鐘估算

}


// ───────────────────────── 主迴圈 ─────────────────────────
function resize() { if (UNIT) return; const r = simEl.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), lastVehicle = 0, lastMini = 0;
function loop(now) {
  if (UNIT) {   // 只有車機：不跑模擬城市（省下 CPU／GPU 給 BeamNG），車速油量由手機推來
    unitNavTick(now);
    const t = new Date(), hhmm = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    document.getElementById('clock2').textContent = hhmm;
    setTimeout(() => requestAnimationFrame(loop), 200);
    return;
  }
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  drive(dt);
  camera.position.set(car.x, 1.4, car.z);
  camera.lookAt(car.x + Math.cos(car.yaw) * 10, 1.1, car.z + Math.sin(car.yaw) * 10);
  navTick(now);
  missionTick(now);
  const pts = nav.dest && !nav.arrived ? currentPath() : [];
  drawRoute3D(pts);
  if (now - lastMini > 100) { lastMini = now; drawMini(pts); }
  const kmh = Math.round(Math.abs(car.v) * 3);
  const fuel = Math.round(car.fuel);
  document.getElementById('speed').textContent = kmh;
  document.getElementById('hudSpeed').textContent = kmh + ' km/h';
  document.getElementById('hudFuel').textContent = '⛽ ' + fuel + '%';
  document.getElementById('fuelTxt').textContent = fuel + '%';
  const bar = document.getElementById('fuelBar'); bar.style.width = fuel + '%'; bar.style.background = fuel <= 15 ? 'var(--bad)' : 'var(--ok)';
  const t = new Date(), hhmm = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
  document.getElementById('hudClock').textContent = hhmm; document.getElementById('clock2').textContent = hhmm;
  if (now - lastVehicle > 1000 && mission.phase !== 'attract') { lastVehicle = now; post({ type: 'vehicle', fuel, speed: kmh }); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
// 展示站：隱藏雛形用的按鈕，顯示開場畫面
if (ST) {
  document.getElementById('freeBtns').style.display = 'none';
  document.getElementById('aNo').textContent = ST.no;
  document.getElementById('aTitle').textContent = ST.name;
  document.getElementById('aTag').textContent = ST.tagline;
  toAttract();
} else if (UNIT) {
  // 只有車機：整頁都是車機；提示訊息改成浮在最上面；加一顆「按住說話」（滑鼠按住，放開送出）
  document.getElementById('app').classList.add('unitOnly');
  const bn = document.getElementById('banner'); bn.classList.add('float'); document.body.appendChild(bn);
  document.title = 'CoDriver 車機（BeamNG）';
  const fb = document.getElementById('freeBtns');
  if (VOICE === 'pc') {   // 電腦麥克風：加「按住說話」；手機不聽，「手機聽我說」用不到
    const mb = document.createElement('button');
    mb.id = 'micBtn'; mb.textContent = '🎙 按住說話';
    mb.addEventListener('mousedown', e => { e.preventDefault(); touch(); pttStart(); });
    ['mouseup', 'mouseleave'].forEach(ev => mb.addEventListener(ev, () => pttStop()));
    fb.insertBefore(mb, fb.firstChild);
    fb.querySelector(`button[onclick="action('listen')"]`).style.display = 'none';
  } else {                // 手機麥克風（預設）：「手機聽我說」放第一個
    const lb = fb.querySelector(`button[onclick="action('listen')"]`);
    lb.classList.add('primary'); fb.insertBefore(lb, fb.firstChild);
  }
  // 轉彎語音：從遊戲 GPS 路線算出來（-noui 下遊戲沒有導航介面）；手機語音模式由手機唸
  document.getElementById('navVoice').parentElement.lastChild.textContent = ' 轉彎語音';
  document.querySelector('#unit .panel:last-child .title span').textContent = '✉️ 訊息與車況（🎮 BeamNG）';
  renderCar(0, 0);
  loadLeaflet();   // 車機地圖：遊戲裡的位置、GPS 路線、目的地
} else {
  document.getElementById('legend').textContent = '↑↓←→ 開車　按住空白鍵 說話　A 自動駕駛　Shift+T 塞車　Shift+G 油量 12%';
}
connect();
requestAnimationFrame(loop);
</script>
</body>
