# CoDriver A 台（遊戲台）設定 —— start_codriver.sh、bng 會讀這個檔
# 改完不用重開遊戲：執行 tools/dgx/bng outgauge 就會套用 OutGauge 設定

# ---- OutGauge（BeamNG 送車速／油量給橋接程式）----
# 單機（遊戲和橋接同一台）：127.0.0.1
# 雙機（A 台遊戲 → B 台橋接）：改成 B 台的 IP，B 台的 .env 設 CODRIVER_OUTGAUGE_LISTEN=0.0.0.0
OUTGAUGE_HOST=127.0.0.1
# 雙機（會場預設）：OUTGAUGE_HOST 維持 127.0.0.1，在 ~/codriver-dgx/local.conf 寫 RELAY_TO=<B 台 IP>，
# start_codriver.sh 會開 codriver_relay.py 轉送（遊戲只准送到 127.x／10.x／172.16～31.x／192.168.x，轉送則不受限）。
# 備案：B 台是私有 IP 時，也可以不用轉送，直接在 local.conf 寫 OUTGAUGE_HOST=<B 台 IP>
RELAY_TO=
OUTGAUGE_PORT=4444

# ---- 啟動時 ----
# 起點：bng place 的名稱，或「緯度 經度」；展示路線：清豐二路起點 → 楠梓車站麥當勞（1.48 公里、約 3 分鐘）
START_PLACE=清豐二路起點
# 啟動時遊戲 GPS 先導航到這裡（車頭會轉向路線；App 規劃導航時橋接會再設一次）；留空 = 不設
START_GPS=楠梓車站麥當勞
# 交通車台數（DGX 實測 10～12 台以內才順；剛生成的 30～60 秒會掉格，所以啟動時就叫好）
START_TRAFFIC=10
# 遊戲畫面：Borderless（無邊框全螢幕）或 Window（視窗）；GAME_RES 是「寬 高」
GAME_MODE=Borderless
GAME_RES="1920 1080"
# 遊戲裡固定幾點（時間不走）；Earth 預設跟真實時間，晚上展示會全黑
GAME_HOUR=13

# ---- 路徑（一般不用改）----
# 執行期資料：BeamNG.Earth 原始碼、Python venv、log（大檔案，不進 git）
CODRIVER_HOME=$HOME/codriver-dgx
STEAM_ROOT=$HOME/snap/steam/common/.local/share/Steam
GAME_DIR=$STEAM_ROOT/steamapps/common/BeamNG.drive
BEAMNG_USER=$HOME/snap/steam/common/.local/share/BeamNG/BeamNG.drive/current
EARTH_DIR=$CODRIVER_HOME/BeamNG.Earth
EARTH_VENV=$CODRIVER_HOME/earth-venv
EARTH_VERSION=v1.9.1-beta

# 這台機器自己的設定（不進 git）：例如雙機時 A 台寫 OUTGAUGE_HOST=<B 台 IP>
# 放在 ~/codriver-dgx/local.conf，會蓋掉上面的值；start_codriver.sh、bng 都會讀
[ -f "$HOME/codriver-dgx/local.conf" ] && source "$HOME/codriver-dgx/local.conf"
